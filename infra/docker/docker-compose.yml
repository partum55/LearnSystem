# ==========================================
# LearnSystem — Canonical Docker Compose
# ==========================================
#
# One file, two run modes:
#
# Local (frontend runs separately via npm):
#   docker compose -f infra/docker/docker-compose.yml \
#     --env-file config/env/.env.local up --build
#
# Production (Caddy profile adds HTTPS reverse proxy):
#   docker compose -f infra/docker/docker-compose.yml \
#     --env-file config/env/.env.production \
#     --profile prod up -d --build
#
# Convenience scripts:
#   ./scripts/dev.sh     — local backend
#   ./scripts/prod.sh    — production backend

name: learnsystem

services:

  # ==========================================
  # REVERSE PROXY — production only
  # Port exposure: 80 and 443 (Caddy only)
  # ==========================================
  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    container_name: lms-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lms-network
    depends_on:
      gateway:
        condition: service_healthy

  # ==========================================
  # CACHE
  # GATEWAY_HOST_PORT / REDIS_HOST_PORT control binding:
  #   local:      8080 / 6380      (binds 0.0.0.0)
  #   production: 127.0.0.1:8080   (localhost only — not internet-reachable)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==========================================
  # MICROSERVICES — internal-only (expose, not ports)
  # Build context is services/ root (Maven multi-module)
  # ==========================================
  user-service:
    build:
      context: ../../services
      dockerfile: user-service/Dockerfile
    container_name: lms-user-service
    restart: always
    expose:
      - "8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8081
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - LEARNING_SERVICE_URL=http://learning-service:8089
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - BOOTSTRAP_ADMIN_ENABLED=${BOOTSTRAP_ADMIN_ENABLED:-false}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - JAVA_OPTS=-Xmx384m -Xms192m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  learning-service:
    build:
      context: ../../services
      dockerfile: learning-service/Dockerfile
    container_name: lms-learning-service
    restart: always
    expose:
      - "8089"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8089
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - EXECUTION_SERVICE_URL=http://execution-service:3000
      - JAVA_OPTS=-Xmx512m -Xms256m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ai-service:
    build:
      context: ../../services
      dockerfile: ai-service/Dockerfile
    container_name: lms-ai-service
    restart: always
    expose:
      - "8085"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8085
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LLAMA_API_URL=${LLAMA_API_URL:-https://api.groq.com/openai/v1}
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - LLAMA_MODEL=${LLAMA_MODEL:-llama-3.3-70b-versatile}
      - JAVA_OPTS=-Xmx768m -Xms384m -XX:+UseG1GC
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  analytics-service:
    build:
      context: ../../services
      dockerfile: analytics-service/Dockerfile
    container_name: lms-analytics-service
    restart: always
    expose:
      - "8088"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8088
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_OPTS=-Xmx384m -Xms192m
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================
  # API GATEWAY — the only public backend entry point
  # Local:      ports 8080:8080 (host-accessible for npm dev server)
  # Production: 127.0.0.1:8080  (localhost only; Caddy proxies via Docker network)
  # ==========================================
  gateway:
    build:
      context: ../../services
      dockerfile: gateway/Dockerfile
    container_name: lms-gateway
    restart: always
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SERVER_PORT=8080
      - USER_SERVICE_URL=http://user-service:8081
      - LEARNING_SERVICE_URL=http://learning-service:8089
      - AI_SERVICE_URL=http://ai-service:8085
      - ANALYTICS_SERVICE_URL=http://analytics-service:8088
      - EXECUTION_SERVICE_URL=http://execution-service:3000
      - GATEWAY_PUBLIC_URL=${API_URL:-http://localhost:8080}
      - GATEWAY_CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JAVA_OPTS=-Xmx384m -Xms192m
    depends_on:
      user-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================
  # EXECUTION SERVICE — internal-only (privileged for isolate sandbox)
  # ==========================================
  execution-service:
    build:
      context: ../../services/execution-service
      dockerfile: Dockerfile
    container_name: lms-execution-service
    restart: unless-stopped
    privileged: true
    expose:
      - "3000"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  redis_data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  lms-network:
    driver: bridge
