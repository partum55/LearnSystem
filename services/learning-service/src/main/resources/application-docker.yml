# Docker profile for learning-service
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_SUPABASE_DB_URL:jdbc:postgresql://postgres:5432/lms_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:lms_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:lms_password}}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  flyway:
    enabled: false
    # Schema managed exclusively by Supabase migrations.

  jpa:
    hibernate:
      ddl-auto: validate

# Disable CORS - handled by API Gateway
security:
  cors:
    enabled: false

execution-service:
  base-url: http://execution-service:3000

submission:
  storage:
    path: ${SUBMISSION_STORAGE_PATH:/tmp/lms-submissions}
